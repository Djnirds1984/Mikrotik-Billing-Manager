<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="color-scheme" content="dark" />
    <title>ISP Billing</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body class="bg-slate-900 text-slate-100 antialiased">
    <main class="min-h-screen w-full flex flex-col items-center justify-center px-6 py-10">
      <!-- ============ Connecting view (shown while auto-redirecting) ============ -->
      <section id="connecting-view" class="view is-hidden w-full max-w-sm text-center">
        <div class="flex flex-col items-center gap-5">
          <div class="spinner spinner-lg"></div>
          <div>
            <p class="text-base font-semibold text-slate-100">Connecting…</p>
            <p id="connecting-domain" class="mt-1 text-xs text-slate-400 break-all"></p>
          </div>
          <p id="connecting-hint" class="text-xs text-slate-500 pulse-dot">
            Reaching your provider's server
          </p>
          <button
            id="connecting-change-btn"
            type="button"
            class="mt-2 text-xs font-medium text-blue-400 underline underline-offset-4"
          >
            Change server
          </button>
        </div>
      </section>

      <!-- ============ Setup view (domain configuration form) ============ -->
      <section id="setup-view" class="view is-hidden w-full max-w-sm">
        <!-- Logo + title -->
        <div class="flex flex-col items-center text-center">
          <div
            class="h-16 w-16 rounded-2xl bg-blue-500/10 border border-blue-500/30 flex items-center justify-center"
          >
            <svg
              class="h-8 w-8 text-blue-500"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="1.8"
              stroke-linecap="round"
              stroke-linejoin="round"
              aria-hidden="true"
            >
              <path d="M2 8.5a15 15 0 0 1 20 0" />
              <path d="M5 12a11 11 0 0 1 14 0" />
              <path d="M8.5 15.5a6.5 6.5 0 0 1 7 0" />
              <circle cx="12" cy="19" r="1.1" fill="currentColor" stroke="none" />
            </svg>
          </div>
          <h1 class="mt-5 text-2xl font-bold tracking-tight text-white">ISP Billing</h1>
          <p class="mt-1.5 text-sm text-slate-400">
            Connect to your Internet Service Provider
          </p>
        </div>

        <!-- Card -->
        <div class="mt-8 rounded-2xl bg-slate-800 border border-slate-700 p-5 shadow-xl">
          <label for="domain-input" class="block text-xs font-semibold uppercase tracking-wide text-slate-400">
            Billing server address
          </label>

          <div class="mt-2 flex items-center rounded-lg bg-slate-900 border border-slate-700 focus-within:border-blue-500 focus-within:ring-2 focus-within:ring-blue-500/25">
            <span class="pl-3 text-sm text-slate-500 select-none">https://</span>
            <input
              id="domain-input"
              type="text"
              inputmode="url"
              autocomplete="off"
              autocapitalize="none"
              spellcheck="false"
              placeholder="billing.your-isp.com"
              class="w-full bg-transparent px-2 py-3 text-sm text-slate-100 placeholder-slate-500 outline-none"
            />
          </div>

          <!-- Status / error messages -->
          <div id="status-box" class="status status-testing mt-3 hidden">
            <span id="status-icon" class="mt-0.5 shrink-0"></span>
            <span id="status-text"></span>
          </div>

          <!-- Actions -->
          <div class="mt-4 space-y-2.5">
            <button
              id="test-btn"
              type="button"
              class="w-full flex items-center justify-center gap-2 rounded-lg border border-slate-600 bg-slate-700/60 px-4 py-3 text-sm font-semibold text-slate-100 hover:bg-slate-700"
            >
              <span id="test-btn-spinner" class="spinner hidden"></span>
              <span id="test-btn-label">Test Connection</span>
            </button>

            <button
              id="connect-btn"
              type="button"
              class="w-full flex items-center justify-center gap-2 rounded-lg bg-blue-600 px-4 py-3 text-sm font-semibold text-white hover:bg-blue-500"
            >
              <span id="connect-btn-spinner" class="spinner hidden"></span>
              <span id="connect-btn-label">Connect</span>
            </button>
          </div>
        </div>

        <!-- Saved-server hint (only when a domain was previously configured) -->
        <p id="saved-hint" class="mt-4 hidden text-center text-xs text-slate-500">
          Saved server:
          <span id="saved-domain" class="text-slate-400 break-all"></span>
        </p>

        <!-- Footer -->
        <footer class="mt-8 text-center">
          <p class="text-xs text-slate-500">Contact your ISP operator for your billing URL</p>
          <button
            id="settings-link"
            type="button"
            class="mt-3 hidden text-xs font-medium text-slate-400 underline underline-offset-4"
          >
            Settings
          </button>
        </footer>
      </section>
    </main>

    <script type="module" src="./setup.js"></script>
  </body>
</html>
